<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>별빛 캠핑장</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #0a1124; color: #fff1db; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100dvh; touch-action: none; }
    header { position: fixed; top: max(24px, env(safe-area-inset-top)); left: max(24px, env(safe-area-inset-left)); pointer-events: none; text-shadow: 0 2px 12px #08101f; }
    h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2.2rem); font-weight: 650; letter-spacing: -.045em; }
    p { margin: .5rem 0 0; color: #e4d8c7; font-size: .86rem; }
    .touch { display: none; }
    @media (pointer: coarse) { .keyboard { display: none; } .touch { display: block; } }
    #error { position: fixed; inset: 40% 1rem auto; text-align: center; }
    #camp-room { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); max-width: min(22rem, calc(100% - 32px)); padding: .75rem; border: 1px solid #c5a57659; border-radius: .75rem; background: #0d1729ed; }
    #camp-room button { padding: .45rem .7rem; border: 0; border-radius: .35rem; background: #efc089; color: #24190f; font: inherit; cursor: pointer; }
    #invite-link { display: block; width: 100%; margin-top: .5rem; }
    #invite-link[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>별빛 캠핑장</h1>
    <p class="keyboard">바닥 클릭 또는 WASD · 방향키로 걷기</p>
    <p class="touch">걷고 싶은 바닥을 눌러 보세요</p>
  </header>
  <section id="camp-room" aria-label="함께 캠핑하기">
    <button id="invite" type="button" disabled>친구 초대</button>
    <input id="invite-link" aria-label="캠핑장 초대 링크" type="url" readonly hidden>
    <p id="room-status" role="status">혼자 캠핑 중</p>
  </section>
  <p id="error" role="status" hidden>3D 화면을 불러오지 못했습니다. 인터넷 연결과 브라우저의 WebGL 지원을 확인해 주세요.</p>
  <script type="module">
    const error = document.querySelector('#error');
    try {
      const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
      start(THREE);
    } catch (cause) {
      error.hidden = false;
      console.error(cause);
    }

    function start(T) {
      const scene = new T.Scene();
      scene.background = new T.Color(0x10192e);
      scene.fog = new T.FogExp2(0x10192e, 0.036);
      const camera = new T.PerspectiveCamera(53, 1, 0.1, 180);
      const renderer = new T.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.22;
      renderer.domElement.setAttribute('aria-label', '별빛 캠핑장 3D 화면');
      document.body.prepend(renderer.domElement);

      function resize() {
        const canvas = renderer.domElement;
        camera.aspect = canvas.clientWidth / canvas.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
      }
      resize();
      addEventListener('resize', resize);

      let seed = 93;
      function random() {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      }

      const matte = (color, flatShading = false) => new T.MeshStandardMaterial({ color, flatShading });
      const glow = color => new T.MeshBasicMaterial({ color, fog: false });
      function mesh(geometry, material, parent, x, y, z) {
        const object = new T.Mesh(geometry, material);
        object.position.set(x, y, z);
        parent.add(object);
        return object;
      }

      scene.add(new T.HemisphereLight(0xa7c3ff, 0x313727, 1.35));
      const moonlight = new T.DirectionalLight(0xa1bcff, 1.15);
      moonlight.position.set(-10, 13, -7);
      scene.add(moonlight);

      const ground = mesh(new T.PlaneGeometry(240, 240), matte(0x283f3c), scene, 0, 0, 0);
      ground.rotation.x = -Math.PI / 2;
      const clearing = mesh(new T.CircleGeometry(6.1, 55), matte(0x57483c), scene, 0, .013, 0);
      clearing.rotation.x = -Math.PI / 2;
      clearing.scale.set(1.12, .91, 1);

      const stars = [];
      for (let i = 0; i < 1050; i++) {
        const angle = random() * Math.PI * 2;
        const height = .06 + random() * .94;
        const radius = 108 * Math.sqrt(1 - height * height);
        stars.push(Math.cos(angle) * radius, height * 108, Math.sin(angle) * radius);
      }
      const sky = new T.BufferGeometry();
      sky.setAttribute('position', new T.Float32BufferAttribute(stars, 3));
      scene.add(new T.Points(sky, new T.PointsMaterial({
        color: 0xd4e4ff, size: 1.8, sizeAttenuation: false, fog: false
      })));
      mesh(new T.SphereGeometry(2.6, 24, 16), glow(0xffe8bd), scene, -26, 21, -65);

      const trunk = new T.CylinderGeometry(.12, .23, 1.8, 7);
      const bark = matte(0x59413e, true);
      const needles = [0x254e50, 0x2d605c, 0x35726a].map(color => matte(color, true));
      const bough = new T.ConeGeometry(1, 1, 8);
      function pine(x, z, scale) {
        const tree = new T.Group();
        scene.add(tree);
        tree.position.set(x, 0, z);
        tree.scale.setScalar(scale);
        tree.rotation.y = random() * Math.PI;
        mesh(trunk, bark, tree, 0, .9, 0);
        for (let tier = 0; tier < 3; tier++) {
          const branch = mesh(bough, needles[tier], tree, 0, 1.78 + tier * .73, 0);
          branch.scale.set(1.21 - tier * .22, 1.92 - tier * .16, 1.21 - tier * .22);
        }
      }
      for (let i = 0; i < 42; i++) {
        const angle = i * Math.PI * 2 / 42 + random() * .11;
        const radius = 9.6 + random() * 17;
        pine(Math.cos(angle) * radius, Math.sin(angle) * radius, .74 + random() * .94);
      }
      pine(-6.9, -3.3, 1.28);
      pine(7.3, -4.8, 1.13);
      pine(-4.1, -7.6, .94);

      const pebble = new T.DodecahedronGeometry(1, 0);
      const stone = matte(0x82827b, true);
      for (let i = 0; i < 72; i++) {
        const angle = random() * Math.PI * 2;
        const radius = 2.3 + random() * 11;
        const rock = mesh(pebble, stone, scene, Math.cos(angle) * radius, .04, Math.sin(angle) * radius);
        const size = .04 + random() * .12;
        rock.scale.set(size * 1.4, size * .55, size);
        rock.rotation.y = angle;
      }
      for (let i = 0; i < 13; i++) {
        const angle = i * Math.PI * 2 / 13;
        const rock = mesh(pebble, stone, scene, Math.cos(angle) * .96, .14, Math.sin(angle) * .96);
        rock.scale.set(.25, .21, .19);
        rock.rotation.y = -angle;
      }
      const log = new T.CylinderGeometry(.12, .15, 1.42, 7);
      for (let i = 0; i < 3; i++) {
        const wood = mesh(log, bark, scene, 0, .18 + i * .066, 0);
        wood.rotation.order = 'YXZ';
        wood.rotation.set(Math.PI / 2.25, i * Math.PI / 3, 0);
      }
      const firelight = new T.PointLight(0xff873c, 40, 15, 2);
      firelight.position.set(0, 1.13, 0);
      scene.add(firelight);
      const flames = [];
      const flameShape = new T.ConeGeometry(1, 1, 6);
      const flameColors = [0xff5929, 0xff9a39, 0xffd375, 0xffedaa].map(glow);
      for (let i = 0; i < 9; i++) {
        const angle = i * 2.4;
        const radius = i < 6 ? .31 : .10;
        const flame = mesh(flameShape, flameColors[i % 4], scene,
          Math.cos(angle) * radius, .58, Math.sin(angle) * radius);
        flames.push(flame);
      }
      const sparkPositions = new Float32Array(40 * 3);
      const sparkGeometry = new T.BufferGeometry();
      sparkGeometry.setAttribute('position', new T.BufferAttribute(sparkPositions, 3).setUsage(T.DynamicDrawUsage));
      const sparks = new T.Points(sparkGeometry, new T.PointsMaterial({
        color: 0xffac56, size: .038, transparent: true, opacity: .83, depthWrite: false
      }));
      sparks.frustumCulled = false;
      scene.add(sparks);

      const player = new T.Group();
      scene.add(player);
      player.position.set(0, 0, 4.6);
      const doll = new T.Group();
      player.add(doll);
      const sphere = new T.SphereGeometry(1, 22, 16);
      const coat = matte(0x56a99b);
      const skin = matte(0xe9b18f);
      const boots = matte(0x41373b);
      const hat = matte(0xe38a52);
      const ink = matte(0x302933);
      function oval(parent, material, x, y, z, sx, sy, sz) {
        const part = mesh(sphere, material, parent, x, y, z);
        part.scale.set(sx, sy, sz);
        return part;
      }
      oval(doll, coat, 0, .54, 0, .32, .36, .25);
      oval(doll, skin, 0, 1, 0, .27, .27, .25);
      oval(doll, hat, 0, 1.16, -.02, .29, .15, .26);
      oval(doll, hat, 0, 1.32, -.03, .075, .075, .075);
      oval(doll, boots, 0, .57, -.2, .22, .24, .12);
      const feet = [], arms = [];
      for (const side of [-1, 1]) {
        oval(doll, ink, side * .088, 1.015, .232, .021, .027, .012);
        arms.push(oval(doll, coat, side * .30, .59, .01, .089, .21, .092));
        feet.push(oval(doll, boots, side * .14, .14, .036, .12, .14, .17));
      }
      player.rotation.y = Math.PI;
      const remoteDoll = doll.clone();

      const barbecue = new T.Group();
      barbecue.position.set(2.55, 0, -.65);
      scene.add(barbecue);
      const iron = matte(0x343239, true);
      const roast = matte(0xc57748);
      const snout = matte(0xe59972);
      const char = matte(0x522e29);
      const box = new T.BoxGeometry(1, 1, 1);
      function block(material, x, y, z, width, height, depth) {
        const piece = mesh(box, material, barbecue, x, y, z);
        piece.scale.set(width, height, depth);
        return piece;
      }
      block(iron, 0, .26, 0, 1.96, .14, .76);
      for (const side of [-1, 1]) {
        block(iron, 0, .37, side * .36, 1.96, .17, .06);
        block(iron, side * .95, .37, 0, .06, .17, .76);
        block(iron, side * 1.02, .66, 0, .09, .78, .09);
        block(iron, side * .77, .1, 0, .15, .2, .65);
      }
      const coal = glow(0xf45d25);
      for (let i = 0; i < 12; i++) {
        const ember = mesh(pebble, coal, barbecue, (i % 6 - 2.5) * .27, .33, i < 6 ? -.16 : .16);
        ember.scale.set(.10, .045, .095);
      }
      const grillLight = new T.PointLight(0xff772f, 3, 2.1, 2);
      grillLight.position.set(0, .52, 0);
      barbecue.add(grillLight);
      const spit = new T.Group();
      spit.position.y = 1.02;
      barbecue.add(spit);
      mesh(new T.CylinderGeometry(.026, .026, 2.44, 8), iron, spit, 0, 0, 0).rotation.z = Math.PI / 2;
      oval(spit, roast, -.1, 0, 0, .65, .31, .32);
      oval(spit, roast, .52, .04, 0, .28, .245, .235);
      oval(spit, snout, .75, -.02, 0, .15, .115, .152);
      const earShape = new T.ConeGeometry(.12, .25, 4);
      for (const side of [-1, 1]) {
        oval(spit, char, .63, .105, side * .196, .024, .026, .018);
        oval(spit, char, .878, -.012, side * .054, .014, .023, .023);
        const ear = mesh(earShape, roast, spit, .45, .255, side * .142);
        ear.rotation.x = side * .42;
        ear.rotation.z = .33;
        const frontLeg = oval(spit, roast, .29, -.23, side * .203, .1, .18, .085);
        const backLeg = oval(spit, roast, -.49, -.22, side * .203, .11, .17, .085);
        frontLeg.rotation.z = -.54;
        backLeg.rotation.z = .44;
      }
      const tailPoints = [];
      for (let i = 0; i <= 28; i++) {
        const angle = i / 28 * Math.PI * 2.35;
        tailPoints.push(new T.Vector3(-.71 - i * .006, .075 + Math.sin(angle) * .065, (1 - Math.cos(angle)) * .063));
      }
      mesh(new T.TubeGeometry(new T.CatmullRomCurve3(tailPoints), 28, .023, 7, false), roast, spit, 0, 0, 0);

      const oak = matte(0xa8673b, true);
      const brass = matte(0xcda368);
      const keg = new T.Group();
      keg.position.set(3.7, 0, .5);
      keg.rotation.y = -.34;
      scene.add(keg);
      const barrelProfile = [[0, .08], [.33, .08], [.39, .25], [.415, .49],
        [.39, .73], [.33, .9], [0, .9]];
      mesh(new T.LatheGeometry(barrelProfile.map(([r, y]) => new T.Vector2(r, y)), 18),
        oak, keg, 0, 0, 0);
      for (const [height, radius] of [[.19, .373], [.49, .415], [.79, .373]]) {
        mesh(new T.CylinderGeometry(radius + .013, radius + .013, .06, 18),
          iron, keg, 0, height, 0);
      }
      mesh(new T.CylinderGeometry(.043, .043, .18, 10), brass, keg, 0, .37, .47)
        .rotation.x = Math.PI / 2;
      mesh(new T.CylinderGeometry(.036, .036, .13, 10), brass, keg, 0, .33, .55);
      oval(keg, char, 0, .47, .48, .036, .075, .036);

      const guitar = new T.Group();
      guitar.position.set(-2.45, .04, -.38);
      guitar.rotation.set(-.17, .35, -.19);
      scene.add(guitar);
      const spruce = matte(0xe5a75c);
      const outline = new T.Shape();
      outline.moveTo(0, .03);
      outline.bezierCurveTo(.36, .03, .43, .32, .27, .49);
      outline.bezierCurveTo(.16, .62, .36, .8, .19, .91);
      outline.bezierCurveTo(.1, .98, -.1, .98, -.19, .91);
      outline.bezierCurveTo(-.36, .8, -.16, .62, -.27, .49);
      outline.bezierCurveTo(-.43, .32, -.36, .03, 0, .03);
      mesh(new T.ExtrudeGeometry(outline, {
        depth: .12, bevelThickness: .022, bevelSize: .022, bevelSegments: 2
      }), [spruce, oak], guitar, 0, 0, -.06);
      mesh(new T.CircleGeometry(.079, 24), char, guitar, 0, .68, .084);
      function guitarBlock(material, x, y, z, width, height, depth) {
        const part = mesh(box, material, guitar, x, y, z);
        part.scale.set(width, height, depth);
      }
      guitarBlock(char, 0, 1.11, .053, .1, .58, .061);
      guitarBlock(oak, 0, 1.47, .053, .155, .21, .072);
      guitarBlock(char, 0, .35, .082, .23, .05, .031);
      for (let i = 0; i < 6; i++) {
        guitarBlock(brass, (i - 2.5) * .014, .91, .102, .003, 1.1, .003);
      }
      for (let i = 0; i < 7; i++) {
        guitarBlock(brass, 0, .87 + i * .077, .086, .102, .005, .004);
      }
      for (const side of [-1, 1]) {
        for (let i = 0; i < 3; i++) {
          oval(guitar, brass, side * .094, 1.41 + i * .061, .056, .027, .016, .02);
        }
      }

      const marker = mesh(new T.RingGeometry(.19, .224, 32), new T.MeshBasicMaterial({
        color: 0xffd999, side: T.DoubleSide, transparent: true, opacity: .8
      }), scene, 0, .027, 0);
      marker.rotation.x = -Math.PI / 2;
      marker.visible = false;

      const keys = new Set();
      const keyAxes = {
        KeyW: [0, 1], ArrowUp: [0, 1], KeyS: [0, -1], ArrowDown: [0, -1],
        KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0]
      };
      const forward = new T.Vector3();
      const right = new T.Vector3();
      const move = new T.Vector3();
      const goal = new T.Vector3();
      const cursor = new T.Vector2();
      const ray = new T.Raycaster();
      const floor = new T.Plane(new T.Vector3(0, 1, 0), 0);
      let walkingToGoal = false;

      addEventListener('keydown', event => {
        if (!keyAxes[event.code]) return;
        event.preventDefault();
        if (burnStart !== null) return;
        if (!keys.size) {
          camera.getWorldDirection(forward);
          forward.y = 0;
          forward.normalize();
          right.set(-forward.z, 0, forward.x);
        }
        keys.add(event.code);
        walkingToGoal = false;
        marker.visible = false;
      });
      addEventListener('keyup', event => keys.delete(event.code));
      addEventListener('blur', () => keys.clear());
      renderer.domElement.addEventListener('pointerdown', event => {
        if (burnStart !== null || !event.isPrimary || event.button !== 0) return;
        const bounds = renderer.domElement.getBoundingClientRect();
        cursor.set((event.clientX - bounds.left) / bounds.width * 2 - 1,
          1 - (event.clientY - bounds.top) / bounds.height * 2);
        ray.setFromCamera(cursor, camera);
        if (!ray.ray.intersectPlane(floor, goal)) return;
        if (goal.lengthSq() < .0001) goal.copy(player.position).normalize();
        goal.clampLength(1.36, 8.2);
        marker.position.set(goal.x, .027, goal.z);
        marker.visible = true;
        walkingToGoal = true;
      });

      const guitarRest = guitar.position.clone();
      const guitarRestRotation = guitar.rotation.clone();
      const playingOffset = new T.Vector3();
      let playing = false;
      let guitarContact = false;
      let audio;
      let noteTime = 0;
      let beat = 0;
      const chords = [[48, 55, 60, 64], [45, 52, 57, 60], [41, 48, 53, 57], [43, 50, 55, 59]];
      const melody = [72, 76, 79, 76, 72, 69, 72, 76, 77, 76, 72, 69, 71, 74, 67, 71];

      function enableAudio() {
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!Audio) return;
        audio ??= new Audio();
        if (audio.state === 'suspended') audio.resume().catch(() => {});
      }
      addEventListener('keydown', event => {
        if (keyAxes[event.code]) enableAudio();
      });
      renderer.domElement.addEventListener('pointerdown', enableAudio);

      function pluck(midi, when, volume) {
        const note = audio.createOscillator();
        const envelope = audio.createGain();
        note.type = 'triangle';
        note.frequency.value = 440 * 2 ** ((midi - 69) / 12);
        envelope.gain.setValueAtTime(.0001, when);
        envelope.gain.exponentialRampToValueAtTime(volume, when + .012);
        envelope.gain.exponentialRampToValueAtTime(.0001, when + .48);
        note.connect(envelope).connect(audio.destination);
        note.start(when);
        note.stop(when + .49);
      }

      function playGuitar(time) {
        if (audio?.state === 'running' && audio.currentTime >= noteTime) {
          const when = audio.currentTime + .025;
          if (beat % 4 === 0) {
            chords[Math.floor(beat / 4) % chords.length].forEach((pitch, index) => {
              pluck(pitch, when + index * .024, .044);
            });
          }
          pluck(melody[beat % melody.length], when, .064);
          beat++;
          noteTime = when + .285;
        }
        arms[0].rotation.x = -1.04 + Math.sin(time * 13) * .28;
        arms[0].rotation.z = .52;
        arms[1].rotation.x = -1.21;
        arms[1].rotation.z = -.63;
      }

      function updateGuitar(time) {
        const distance = player.position.distanceTo(playingOffset.copy(guitarRest).setY(0));
        if (distance > .95) guitarContact = false;
        if (!guitarContact && distance < .65) {
          guitarContact = true;
          playing = true;
          walkingToGoal = false;
          marker.visible = false;
          keys.clear();
          beat = 0;
          noteTime = 0;
          player.add(guitar);
          guitar.position.set(-.06, .48, .3);
          guitar.rotation.set(-.08, 0, -1.13);
          guitar.scale.setScalar(.58);
        }
        if (playing && (keys.size || walkingToGoal)) {
          playing = false;
          scene.add(guitar);
          guitar.position.copy(guitarRest);
          guitar.rotation.copy(guitarRestRotation);
          guitar.scale.setScalar(1);
          for (const arm of arms) arm.rotation.z = 0;
        }
        if (playing) playGuitar(time);
      }

      const beerCup = new T.Group();
      beerCup.visible = false;
      player.add(beerCup);
      const glass = new T.MeshStandardMaterial({
        color: 0xffedbb, transparent: true, opacity: .36, roughness: .24, depthWrite: false
      });
      const beer = matte(0xda862c);
      const foam = matte(0xffedcd);
      const beerFill = new T.Group();
      beerFill.position.y = -.17;
      beerCup.add(beerFill);
      mesh(new T.CylinderGeometry(.12, .112, .245, 24), beer, beerFill, 0, .127, 0);
      mesh(new T.CylinderGeometry(.121, .119, .038, 24), foam, beerFill, 0, .263, 0);
      mesh(new T.CylinderGeometry(.134, .12, .36, 24, 1, true), glass, beerCup, 0, 0, 0);
      mesh(new T.TorusGeometry(.132, .009, 8, 24), glass, beerCup, 0, .18, 0).rotation.x = Math.PI / 2;
      mesh(new T.TorusGeometry(.085, .016, 8, 20), glass, beerCup, .168, -.026, 0);

      let kegContact = false;
      let drinkStart = -Infinity;
      let drinkHeading = 0;
      function updateDrinking(time) {
        const distance = player.position.distanceTo(keg.position);
        if (distance > .95) kegContact = false;
        if (!kegContact && distance < .65 && !playing) {
          kegContact = true;
          drinkStart = time;
          drinkHeading = player.rotation.y;
          walkingToGoal = false;
          marker.visible = false;
          keys.clear();
        }

        const elapsed = time - drinkStart;
        beerCup.visible = elapsed < 2.35;
        if (!beerCup.visible) return;
        const turn = T.MathUtils.smoothstep(elapsed, .36, 2.22);
        const dance = Math.sin(Math.PI * turn);
        const step = Math.sin(elapsed * 17);
        player.rotation.y = drinkHeading + turn * Math.PI * 2;
        doll.position.y = Math.abs(step) * .085 * dance;
        doll.rotation.z = step * .13 * dance;
        feet[0].position.z += step * .12 * dance;
        feet[1].position.z -= step * .12 * dance;
        arms[0].rotation.x = (-.5 + step * .55) * dance;

        const lift = T.MathUtils.smoothstep(elapsed, 0, .65) *
          (1 - T.MathUtils.smoothstep(elapsed, 1.62, 2.35));
        const sip = T.MathUtils.smoothstep(elapsed, .7, 1.02) *
          (1 - T.MathUtils.smoothstep(elapsed, 1.43, 1.68));
        beerCup.position.set(.30 - .27 * lift, .54 + .33 * lift + doll.position.y, .28 + .035 * lift);
        beerCup.rotation.set(-sip * .8, 0, -.12 + .12 * lift);
        beerFill.scale.y = 1 - .43 * T.MathUtils.smoothstep(elapsed, .97, 1.46);
        arms[1].rotation.x = -.72 - .82 * lift;
        arms[1].rotation.z = -.48 * lift;
      }

      const barbecueBite = new T.Group();
      barbecueBite.visible = false;
      player.add(barbecueBite);
      const bone = matte(0xf0d5ab);
      oval(barbecueBite, bone, 0, .025, 0, .053, .19, .053);
      oval(barbecueBite, bone, -.038, -.135, 0, .052, .051, .049);
      oval(barbecueBite, bone, .038, -.135, 0, .052, .051, .049);
      const meat = oval(barbecueBite, roast, 0, .135, 0, .115, .137, .094);
      const mouth = oval(doll, char, 0, .932, .237, .043, .012, .016);
      mouth.visible = false;
      let barbecueContact = false;
      let biteStart = -Infinity;
      let biteHeading = 0;
      function updateEating(time) {
        const distance = player.position.distanceTo(barbecue.position);
        if (distance > 1.14) barbecueContact = false;
        if (!barbecueContact && distance < .86 && !playing && !beerCup.visible) {
          barbecueContact = true;
          biteStart = time;
          biteHeading = player.rotation.y;
          walkingToGoal = false;
          marker.visible = false;
          keys.clear();
        }

        const elapsed = time - biteStart;
        barbecueBite.visible = elapsed < 2.65;
        mouth.visible = barbecueBite.visible;
        if (elapsed >= .84 && elapsed < 2.65) {
          const turn = T.MathUtils.smoothstep(elapsed, .84, 2.25);
          player.rotation.y = biteHeading + turn * Math.PI * 2;
        }
        if (!barbecueBite.visible) return;

        const lift = T.MathUtils.smoothstep(elapsed, 0, .68) *
          (1 - T.MathUtils.smoothstep(elapsed, 1.03, 1.58));
        const chew = elapsed > .84 && elapsed < 2.25 ? (1 + Math.sin(elapsed * 23)) * .5 : 0;
        barbecueBite.position.set(.27 - .23 * lift, .57 + .24 * lift, .28 + .035 * lift);
        barbecueBite.rotation.set(-.16 - .66 * lift, 0, -.26 + .15 * lift);
        meat.scale.set(.115, .137, .094).multiplyScalar(elapsed < .87 ? 1 : .53);
        mouth.scale.y = .012 + chew * .022;
        arms[1].rotation.x = -.81 - .69 * lift;
        arms[1].rotation.z = -.43 * lift;
      }

      const playerFlames = new T.Group();
      playerFlames.visible = false;
      player.add(playerFlames);
      for (let i = 0; i < 8; i++) {
        const angle = i * Math.PI / 4;
        mesh(flameShape, flameColors[i % flameColors.length], playerFlames,
          Math.cos(angle) * .37, .48, Math.sin(angle) * .37);
      }

      let burnStart = null;
      function updateBurning(time) {
        if (burnStart === null) {
          if (player.position.lengthSq() > 1.43 ** 2) return;
          burnStart = time;
          keys.clear();
          walkingToGoal = false;
          marker.visible = false;
          playerFlames.visible = true;
        }

        const elapsed = time - burnStart;
        if (elapsed >= 1.35) {
          burnStart = null;
          playerFlames.visible = false;
          player.position.set(0, 0, 4.6);
          player.rotation.y = Math.PI;
          doll.rotation.z = 0;
          doll.position.y = 0;
          return;
        }

        doll.rotation.z = Math.sin(elapsed * 31) * .16;
        doll.position.y = Math.abs(Math.sin(elapsed * 18)) * .18;
        playerFlames.children.forEach((flame, index) => {
          const height = .58 + Math.sin(elapsed * 20 + index * 2) * .24;
          flame.scale.set(.16, height, .16);
          flame.position.y = .23 + height * .5;
        });
      }

      const cameraGoal = new T.Vector3();
      const look = new T.Vector3();
      const radial = new T.Vector3();
      const next = new T.Vector3();
      let followAngle = Math.PI;
      const wrap = angle => Math.atan2(Math.sin(angle), Math.cos(angle));
      function follow(dt) {
        let heading = player.rotation.y;
        if (barbecueBite.visible) heading = biteHeading;
        if (beerCup.visible) heading = drinkHeading;
        followAngle += wrap(heading - followAngle) * (1 - Math.exp(-2.8 * dt));
        const distance = camera.aspect < 1 ? 6.5 : 5.6;
        cameraGoal.set(player.position.x - Math.sin(followAngle) * distance,
          3.35, player.position.z - Math.cos(followAngle) * distance);
        camera.position.lerp(cameraGoal, 1 - Math.exp(-5 * dt));
        look.set(player.position.x + Math.sin(followAngle) * 1.85,
          1.55, player.position.z + Math.cos(followAngle) * 1.85);
        camera.lookAt(look);
      }
      follow(10);

      const fireworks = new T.Group();
      scene.add(fireworks);
      const fireworkGeometry = new T.BufferGeometry();
      const burstPositions = new Float32Array(84 * 3);
      const burstAttribute = new T.BufferAttribute(burstPositions, 3).setUsage(T.DynamicDrawUsage);
      fireworkGeometry.setAttribute('position', burstAttribute);
      const burstMaterial = new T.PointsMaterial({
        color: 0xffc477, size: .23, transparent: true, depthWrite: false,
        blending: T.AdditiveBlending, fog: false
      });
      const burst = new T.Points(fireworkGeometry, burstMaterial);
      burst.frustumCulled = false;
      fireworks.add(burst);
      const rocket = mesh(new T.SphereGeometry(.12, 8, 6), glow(0xffdd9e), fireworks, 0, 0, 0);
      const burstDirections = Array.from({ length: 84 }, (_, index) => {
        const y = 1 - 2 * (index + .5) / 84;
        const radius = Math.sqrt(1 - y * y);
        const angle = index * 2.399963;
        const speed = 2.3 + (index % 7) * .4;
        return new T.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius).multiplyScalar(speed);
      });
      const fireworkColors = [0xffb955, 0xff699f, 0x78ccff, 0xb39aff, 0x88ffd1];
      let fireworkNumber = 0;
      let nextLaunch = .65;
      let launchTime = -10;
      function updateFireworks(time) {
        if (time >= nextLaunch) {
          launchTime = time;
          nextLaunch = time + 4.4;
          const angle = followAngle + Math.sin(fireworkNumber * 2.4) * .22;
          fireworks.position.set(player.position.x + Math.sin(angle) * 38, 0,
            player.position.z + Math.cos(angle) * 38);
          burstMaterial.color.setHex(fireworkColors[fireworkNumber % fireworkColors.length]);
          fireworkNumber++;
        }

        const age = time - launchTime;
        const burstAge = age - 1.15;
        rocket.visible = age >= 0 && burstAge < 0;
        burst.visible = burstAge >= 0 && burstAge < 1.8;
        if (rocket.visible) {
          rocket.position.y = 1 + 7.4 * age - 1.5 * age * age;
        }
        if (burst.visible) {
          const spread = 1 - Math.exp(-burstAge * 1.7);
          const fall = 1.05 * burstAge * burstAge;
          burstDirections.forEach((direction, index) => {
            burstAttribute.setXYZ(index, direction.x * spread,
              7.53 + direction.y * spread - fall, direction.z * spread);
          });
          burstAttribute.needsUpdate = true;
          burstMaterial.opacity = (1 - burstAge / 1.8) ** 1.25;
        }
      }

      const clock = new T.Clock();
      const inviteButton = document.querySelector('#invite');
      const inviteLink = document.querySelector('#invite-link');
      const roomStatus = document.querySelector('#room-status');
      const guests = new Map();
      const connectedPeers = new Set();
      const guestCoats = [0xe9a561, 0x93a7e6, 0xd687a2, 0xb3bd73].map(color => matte(color));
      let onlineRoom;
      let poseAction;
      let nextPose = 0;
      let sendingPose = false;

      function showOccupancy() {
        roomStatus.textContent = connectedPeers.size
          ? `함께 캠핑 중 · ${connectedPeers.size + 1}명`
          : '친구를 기다리는 중 · 1명';
      }

      function receivePose(pose, { peerId }) {
        if (!connectedPeers.has(peerId) || !Array.isArray(pose) || pose.length !== 6 ||
          !pose.every(Number.isFinite)) return;
        const [x, z, heading, stride, bob, lean] = pose;
        if (Math.hypot(x, z) > 8.3 || Math.abs(stride) > 1 || bob < 0 || bob > .2 ||
          Math.abs(lean) > .2) return;
        let guest = guests.get(peerId);
        if (!guest) {
          const avatar = remoteDoll.clone();
          const color = guestCoats[peerId.charCodeAt(0) % guestCoats.length];
          for (const part of avatar.children) {
            if (part.material === coat) part.material = color;
          }
          avatar.position.set(x, bob, z);
          avatar.rotation.y = heading;
          scene.add(avatar);
          guest = {
            avatar,
            target: new T.Vector3(),
            feet: feet.map(foot => avatar.children[doll.children.indexOf(foot)]),
            arms: arms.map(arm => avatar.children[doll.children.indexOf(arm)])
          };
          guests.set(peerId, guest);
        }
        guest.target.set(x, bob, z);
        Object.assign(guest, { heading, stride, lean });
      }

      async function joinCamp(code) {
        inviteButton.disabled = true;
        roomStatus.textContent = '캠핑장 방에 연결하는 중…';
        try {
          const { joinRoom } = await import('https://esm.run/trystero@0.27.0');
          onlineRoom = joinRoom({ appId: 'ljwook71-lab/hoseo-campfire', maxReceiveBytes: 4096 }, code);
          poseAction = onlineRoom.makeAction('camper-pose');
          poseAction.onMessage(receivePose);
          onlineRoom.onPeerJoin(({ peerId }) => {
            connectedPeers.add(peerId);
            showOccupancy();
          }, { replay: true });
          onlineRoom.onPeerLeave(({ peerId }) => {
            connectedPeers.delete(peerId);
            const guest = guests.get(peerId);
            if (guest) scene.remove(guest.avatar);
            guests.delete(peerId);
            showOccupancy();
          });
          await onlineRoom.ready;
          if (player.position.x === 0 && player.position.z === 4.6) {
            player.position.x = (Math.random() - .5) * 4;
          }
          inviteLink.value = location.href;
          inviteLink.hidden = false;
          inviteButton.textContent = '초대 링크 복사';
          showOccupancy();
        } catch (error) {
          if (onlineRoom) void onlineRoom.leave().catch(() => {});
          onlineRoom = undefined;
          poseAction = undefined;
          roomStatus.textContent = '방에 연결하지 못했어요. 다시 시도해 주세요.';
          console.warn(error);
        } finally {
          inviteButton.disabled = false;
        }
      }

      const roomCode = () => /^#camp=([a-f0-9]{32})$/.exec(location.hash)?.[1];
      inviteButton.disabled = false;
      inviteButton.addEventListener('click', async () => {
        if (!onlineRoom) {
          const code = roomCode() ?? Array.from(crypto.getRandomValues(new Uint8Array(16)),
            byte => byte.toString(16).padStart(2, '0')).join('');
          history.replaceState(null, '', '#camp=' + code);
          await joinCamp(code);
        }
        if (!onlineRoom) return;
        try {
          await navigator.clipboard.writeText(inviteLink.value);
          roomStatus.textContent = '초대 링크를 복사했어요.';
        } catch {
          inviteLink.focus();
          inviteLink.select();
        }
      });
      const invitedCode = roomCode();
      if (invitedCode) void joinCamp(invitedCode);
      addEventListener('pagehide', event => {
        if (!event.persisted && onlineRoom) void onlineRoom.leave().catch(() => {});
      });

      function updateGuests(dt, time, stride) {
        const blend = 1 - Math.exp(-15 * dt);
        for (const { avatar, target, heading, stride: step, lean, feet, arms } of guests.values()) {
          if (avatar.position.distanceToSquared(target) > 9) avatar.position.copy(target);
          else avatar.position.lerp(target, blend);
          avatar.rotation.y += wrap(heading - avatar.rotation.y) * blend;
          avatar.rotation.z = lean;
          feet[0].position.z = .036 + step * .13;
          feet[1].position.z = .036 - step * .13;
          arms[0].rotation.x = step * .65;
          arms[1].rotation.x = -step * .65;
        }
        if (!poseAction || !connectedPeers.size || sendingPose || time < nextPose) return;
        nextPose = time + .085;
        sendingPose = true;
        const pose = [player.position.x, player.position.z, wrap(player.rotation.y),
          stride, doll.position.y, doll.rotation.z];
        void poseAction.send(pose).catch(() => {}).finally(() => { sendingPose = false; });
      }

      let gait = 0;
      function frame() {
        const dt = Math.min(clock.getDelta(), .045);
        const time = clock.elapsedTime;
        if (barbecueBite.visible && (keys.size || walkingToGoal)) biteStart = -Infinity;
        if (beerCup.visible && (keys.size || walkingToGoal)) {
          drinkStart = -Infinity;
        }
        move.set(0, 0, 0);
        if (keys.size) {
          for (const key of keys) {
            const [x, y] = keyAxes[key];
            move.addScaledVector(right, x).addScaledVector(forward, y);
          }
          move.normalize();
        } else if (walkingToGoal) {
          move.subVectors(goal, player.position);
          if (move.length() < .06) {
            walkingToGoal = false;
            marker.visible = false;
            move.set(0, 0, 0);
          } else {
            move.normalize();
            radial.copy(player.position).normalize();
            next.copy(player.position).addScaledVector(move, Math.min(1.7, player.position.distanceTo(goal)));
            if (next.lengthSq() < 1.25 ** 2) {
              const side = radial.x * goal.z - radial.z * goal.x < 0 ? -1 : 1;
              move.set(-radial.z * side, .0, radial.x * side).addScaledVector(radial, .12).normalize();
            }
          }
        }

        let speed = 0;
        if (burnStart === null && move.lengthSq() > 0) {
          const step = Math.min(2.75 * dt, walkingToGoal && !keys.size ? player.position.distanceTo(goal) : Infinity);
          next.copy(player.position).addScaledVector(move, step).clampLength(1.28, 8.2);
          speed = dt > 0 ? player.position.distanceTo(next) / dt : 0;
          player.position.copy(next);
          const heading = Math.atan2(move.x, move.z);
          player.rotation.y += wrap(heading - player.rotation.y) * (1 - Math.exp(-14 * dt));
        }
        gait += speed * dt * 4.8;
        const stride = Math.min(speed / 2.75, 1) * Math.sin(gait);
        doll.position.y = Math.abs(stride) * .065;
        doll.rotation.z = 0;
        feet[0].position.z = .036 + stride * .13;
        feet[1].position.z = .036 - stride * .13;
        arms[0].rotation.x = stride * .65;
        arms[1].rotation.x = -stride * .65;
        if (!playing) arms[1].rotation.z = 0;

        for (let i = 0; i < flames.length; i++) {
          const flicker = Math.sin(time * (8 + i * .48) + i * 2.1);
          const height = (i < 6 ? .7 : 1.19) + flicker * .17;
          flames[i].scale.set(.23 + flicker * .035, height, .23 + flicker * .035);
          flames[i].position.y = .25 + height * .5;
          flames[i].rotation.z = Math.sin(time * 5 + i) * .18;
        }
        firelight.intensity = 39 + Math.sin(time * 13) * 4 + Math.sin(time * 23) * 2;
        for (let i = 0; i < 40; i++) {
          const age = (time * (.41 + (i % 5) * .052) + i * .618) % 1;
          const angle = i * 2.4 + age * 2.7;
          sparkPositions[i * 3] = Math.cos(angle) * (.17 + age * .68) + age * .34;
          sparkPositions[i * 3 + 1] = .52 + age * (1.5 + (i % 9) * .23);
          sparkPositions[i * 3 + 2] = Math.sin(angle) * (.17 + age * .68);
        }
        sparkGeometry.attributes.position.needsUpdate = true;
        marker.material.opacity = .65 + Math.sin(time * 4) * .17;
        updateFireworks(time);
        updateGuitar(time);
        updateDrinking(time);
        updateEating(time);
        updateBurning(time);
        updateGuests(dt, time, stride);
        follow(dt);
        spit.rotation.x = time * .72;
        renderer.render(scene, camera);
      }
      renderer.setAnimationLoop(frame);
    }
  </script>
</body>
</html>
